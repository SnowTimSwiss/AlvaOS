[package]
name = "alvaos-core"
description = "The AlvaOS computer app without its window: connecting, AlvaOS Link, the local proxy"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
iroh = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
url = "2"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
trash = "5"
filetime = "0.2"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.15", default-features = false }
libc = "0.2"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["full"] }
