# Type checking for the backend. Run from the repository root: `mypy`
[mypy]
python_version = 3.11
files = backend, backend/alvaos-priv
exclude = (?x)(^backend/tests/)
mypy_path = backend
# Flask, psutil, pyotp etc. ship without stubs on Debian; don't fail on them.
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
check_untyped_defs = True
