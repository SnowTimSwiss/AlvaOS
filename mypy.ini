# Type checking for the backend. Run from the repository root: `mypy`
[mypy]
python_version = 3.11
files = backend, backend/alvaos-priv
exclude = (?x)(^backend/tests/)
mypy_path = backend
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
check_untyped_defs = True

# pillow-heif is an optional package (HEIC previews); the code works without it.
[mypy-pillow_heif]
ignore_missing_imports = True
