<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlvaOS - Initial Setup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-surface: #161b22;
            --bg-border: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent-primary: #58a6ff;
            --accent-success: #238636;
            --accent-danger: #f85149;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .setup-container {
            max-width: 500px;
            width: 100%;
            background: var(--bg-surface);
            border: 1px solid var(--bg-border);
            border-radius: 8px;
            padding: 2.5rem;
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h1 {
            font-size: 2rem;
            color: var(--accent-primary);
            margin-bottom: 0.5rem;
        }

        .logo p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .setup-content h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .setup-content>p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.875rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-primary);
            border: 1px solid var(--bg-border);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .password-requirements {
            margin-top: 0.5rem;
            padding: 0.75rem;
            background: rgba(88, 166, 255, 0.1);
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .password-requirements ul {
            margin: 0.5rem 0 0 1.25rem;
            color: var(--text-secondary);
        }

        .password-requirements li {
            margin: 0.25rem 0;
        }

        .password-requirements li.valid {
            color: var(--accent-success);
        }

        .btn {
            width: 100%;
            padding: 0.875rem;
            background: var(--accent-primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            background: var(--accent-danger);
            color: white;
            padding: 0.875rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }

        .success-message {
            background: var(--accent-success);
            color: white;
            padding: 0.875rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            text-align: center;
        }

        .loading {
            text-align: center;
            padding: 2rem;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {

            0%,
            20% {
                content: '.';
            }

            40% {
                content: '..';
            }

            60%,
            100% {
                content: '...';
            }
        }
    </style>
</head>

<body>
    <div class="setup-container">
        <div class="logo">
            <h1>AlvaOS</h1>
            <p>Initial System Setup</p>
        </div>

        <div id="setup-content" class="setup-content">
            <h2>Welcome to AlvaOS!</h2>
            <p>Before you can use your system, you need to set a secure password for the root account. This is required
                for both Web UI and SSH access.</p>

            <div id="error-container"></div>

            <form id="setup-form">
                <div class="form-group">
                    <label for="password">New Root Password</label>
                    <input type="password" id="password" name="password" required autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="password-confirm">Confirm Password</label>
                    <input type="password" id="password-confirm" name="password-confirm" required
                        autocomplete="new-password">
                </div>

                <div class="password-requirements">
                    <strong>Password Requirements:</strong>
                    <ul id="requirements">
                        <li id="req-length">At least 8 characters</li>
                        <li id="req-match">Passwords match</li>
                    </ul>
                </div>

                <button type="submit" class="btn" id="submit-btn">Complete Setup</button>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = '/api/v1';
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('password-confirm');
        const submitBtn = document.getElementById('submit-btn');
        const setupForm = document.getElementById('setup-form');
        const errorContainer = document.getElementById('error-container');

        // Password validation
        function validatePassword() {
            const password = passwordInput.value;
            const confirm = confirmInput.value;

            const lengthValid = password.length >= 8;
            const matchValid = password === confirm && password.length > 0;

            // Update UI
            document.getElementById('req-length').className = lengthValid ? 'valid' : '';
            document.getElementById('req-match').className = matchValid ? 'valid' : '';

            // Enable/disable submit button
            submitBtn.disabled = !(lengthValid && matchValid);

            return lengthValid && matchValid;
        }

        passwordInput.addEventListener('input', validatePassword);
        confirmInput.addEventListener('input', validatePassword);

        // Show error message
        function showError(message) {
            errorContainer.innerHTML = `<div class="error-message">${message}</div>`;
        }

        function clearError() {
            errorContainer.innerHTML = '';
        }

        // Handle form submission
        setupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearError();

            if (!validatePassword()) {
                showError('Please meet all password requirements');
                return;
            }

            const password = passwordInput.value;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Setting up...';

            try {
                const response = await fetch(`${API_BASE}/setup/complete`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Setup failed');
                }

                // Success! Store token and show message
                localStorage.setItem('alvaos_token', data.token);
                document.getElementById('setup-content').innerHTML = `
                    <div class="success-message">
                        <h2 style="margin-bottom: 1rem;">✓ Setup Complete!</h2>
                        <p style="margin-bottom: 1rem;">Your password has been set successfully.</p>
                        <p>Redirecting to dashboard...</p>
                    </div>
                `;

                // Redirect to main UI after 2 seconds
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);

            } catch (error) {
                showError(error.message);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Complete Setup';
            }
        });

        // Initial validation
        validatePassword();
    </script>
</body>

</html>
