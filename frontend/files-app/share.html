<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Shared with you</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/app.css">
</head>
<body class="public">
    <header class="pub-head">
        <img src="/icon.svg" alt="" width="30" height="30">
        <div class="pub-title"><strong id="pub-name">Shared with you</strong><span id="pub-by"></span></div>
    </header>

    <main class="pub-main">
        <form class="signin-card" id="pub-lock" hidden novalidate>
            <img class="signin-logo" src="/icon.svg" alt="" width="48" height="48">
            <h1>This link has a password</h1>
            <p class="signin-sub">Ask the person who sent it for the password.</p>
            <div class="notice" id="pub-lock-error" role="alert"></div>
            <label class="field">Password<input id="pub-pass" type="password" autocomplete="off"></label>
            <button type="submit" class="btn primary wide">Open</button>
        </form>

        <div class="pub-error" id="pub-error" hidden></div>

        <section class="pub-file" id="pub-file" hidden>
            <div class="pub-preview" id="pub-preview"></div>
            <div class="pub-file-name" id="pub-file-name"></div>
            <a class="btn primary" id="pub-download" href="#" download><span data-icon="download"></span>Download</a>
        </section>

        <section class="pub-drop" id="pub-drop" hidden>
            <label class="pub-drop-zone" id="pub-drop-zone">
                <span data-icon="upload"></span>
                <strong>Drop files here</strong>
                <span>or click to choose them</span>
                <input type="file" id="pub-drop-input" multiple hidden>
            </label>
            <p class="pub-drop-note">You can only add files. What is already in this folder stays private.</p>
            <ul class="pub-drop-list" id="pub-drop-list" aria-live="polite"></ul>
        </section>

        <section class="pub-folder" id="pub-folder" hidden>
            <div class="pub-folder-bar"><nav class="crumbs" id="pub-crumbs" aria-label="Folder"></nav>
                <a class="btn" id="pub-zip" href="#" download><span data-icon="download"></span>Download all</a></div>
            <div class="items grid" id="pub-items"></div>
        </section>
    </main>

    <div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="viewer-title">
        <div class="viewer-bar">
            <button type="button" class="vbtn" id="viewer-close" aria-label="Close"><span data-icon="x"></span></button>
            <span class="viewer-title" id="viewer-title"></span>
            <a class="vbtn" id="viewer-download" href="#" download><span data-icon="download"></span><span class="hide-phone">Download</span></a>
        </div>
        <div class="viewer-body" id="viewer-body"></div>
    </div>

    <script src="/share.js"></script>
</body>
</html>
