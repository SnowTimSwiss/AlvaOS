<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AlvaOS Hub</title>
    <meta name="theme-color" content="#1f5fd1">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="hub.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="hub.svg">
    <link rel="stylesheet" href="app.css">
    <link rel="stylesheet" href="calendar.css">
    <link rel="stylesheet" href="chat.css">
</head>
<body>
    <!-- Sign in -->
    <main class="signin" id="signin" hidden>
        <form class="signin-card" id="signin-form" novalidate>
            <img class="signin-logo" src="hub.svg" alt="" width="56" height="56">
            <h1>AlvaOS Hub</h1>
            <p class="signin-sub" id="signin-sub">Sign in with your name and password.</p>
            <div class="notice" id="signin-error" role="alert"></div>
            <label class="field" id="field-user">Name<input id="in-user" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
            <label class="field" id="field-pass">Password<input id="in-pass" type="password" autocomplete="current-password" required></label>
            <label class="field" id="field-code" hidden>Code from your authenticator app<input id="in-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></label>
            <button type="submit" class="btn primary wide" id="signin-btn">Sign in</button>
        </form>
    </main>

    <!-- The app -->
    <div class="app" id="app" hidden>
        <!-- The Hub's apps (hub_apps.py). Only shown with more than one app. -->
        <nav class="rail" id="rail" aria-label="AlvaOS Hub" hidden></nav>
        <aside class="side" id="side">
            <div class="side-head">
                <img src="icon.svg" alt="" width="30" height="30">
                <div><h1 class="side-title">Files</h1><div class="side-nas" id="nas-name"></div></div>
            </div>
            <nav class="side-list" id="share-list" aria-label="Shared folders"></nav>
            <div class="side-tools">
                <button type="button" class="side-item" id="links-nav"><span class="ic" data-icon="link"></span><span>Shared links</span><span class="ro new-badge" id="links-badge" hidden></span></button>
                <button type="button" class="side-item" id="trash-nav"><span class="ic" data-icon="trash"></span><span>Trash</span></button>
                <button type="button" class="side-item" id="connect-nav"><span class="ic" data-icon="monitor"></span><span>Connect a computer</span></button>
                <button type="button" class="side-item" id="devices-nav"><span class="ic" data-icon="phone"></span><span>Phones and devices</span></button>
            </div>
            <div class="space" id="space" hidden></div>
            <div class="side-foot">
                <div class="me"><span class="avatar" id="me-avatar"></span><span id="me-name"></span></div>
                <button type="button" class="link" id="signout">Sign out</button>
            </div>
        </aside>
        <div class="scrim" id="scrim" hidden></div>
        <!-- Calendar and Chat (calendar.js, chat.js) draw themselves here. -->
        <div class="view cal" id="calendar-view" hidden></div>
        <div class="view chat" id="chat-view" hidden></div>

        <main class="main" id="main">
            <header class="bar">
                <button type="button" class="icon-btn only-phone" id="menu-btn" aria-label="Shared folders"><span data-icon="menu"></span></button>
                <button type="button" class="icon-btn" id="back-btn" aria-label="Back" title="Back"><span data-icon="left"></span></button>
                <button type="button" class="icon-btn hide-phone" id="fwd-btn" aria-label="Forward" title="Forward"><span data-icon="right"></span></button>
                <nav class="crumbs" id="crumbs" aria-label="Folder"></nav>
                <div class="bar-right">
                    <button type="button" class="icon-btn only-phone" id="search-btn" aria-label="Search" title="Search"><span data-icon="search"></span></button>
                    <label class="search" id="search-box"><span data-icon="search"></span><input type="search" id="search" placeholder="Search" aria-label="Search in this folder and its subfolders" enterkeyhint="search"></label>
                    <div class="new-wrap">
                        <button type="button" class="icon-btn" id="sort-btn" aria-label="Sort" title="Sort" aria-haspopup="menu" aria-expanded="false"><span data-icon="sort"></span></button>
                        <div class="menu" id="sort-menu" hidden role="menu" aria-label="Sort">
                            <button type="button" role="menuitemradio" data-sort="name:asc">Name A–Z</button>
                            <button type="button" role="menuitemradio" data-sort="name:desc">Name Z–A</button>
                            <button type="button" role="menuitemradio" data-sort="modified:desc">Newest first</button>
                            <button type="button" role="menuitemradio" data-sort="modified:asc">Oldest first</button>
                            <button type="button" role="menuitemradio" data-sort="size:desc">Largest first</button>
                            <button type="button" role="menuitemradio" data-sort="size:asc">Smallest first</button>
                            <button type="button" role="menuitemradio" data-sort="type:asc">Type</button>
                        </div>
                    </div>
                    <div class="seg" role="group" aria-label="View">
                        <button type="button" class="icon-btn" id="view-grid" aria-label="Grid" title="Grid"><span data-icon="grid"></span></button>
                        <button type="button" class="icon-btn" id="view-list" aria-label="List" title="List"><span data-icon="list"></span></button>
                    </div>
                    <div class="new-wrap more-wrap">
                        <button type="button" class="icon-btn" id="more-btn" aria-label="More" title="More" aria-haspopup="menu" aria-expanded="false"><span data-icon="more"></span></button>
                        <div class="menu" id="more-menu" hidden role="menu" aria-label="More"></div>
                    </div>
                    <div class="new-wrap">
                        <button type="button" class="btn primary" id="new-btn"><span data-icon="plus"></span><span class="hide-phone">New</span></button>
                        <div class="menu" id="new-menu" hidden role="menu">
                            <button type="button" role="menuitem" data-new="upload"><span data-icon="upload"></span>Upload files</button>
                            <button type="button" role="menuitem" data-new="upload-folder"><span data-icon="folder-up"></span>Upload a folder</button>
                            <button type="button" role="menuitem" data-new="folder"><span data-icon="folder-plus"></span>New folder</button>
                        </div>
                    </div>
                    <input type="file" id="file-input" multiple hidden>
                    <input type="file" id="folder-input" webkitdirectory multiple hidden>
                </div>
            </header>

            <div class="chips" id="share-chips" role="group" aria-label="Shared folders" hidden></div>

            <div class="selbar" id="selbar" hidden>
                <button type="button" class="icon-btn" id="sel-clear" aria-label="Clear selection"><span data-icon="x"></span></button>
                <span id="sel-count"></span>
                <div class="selbar-actions">
                    <button type="button" class="btn ghost" id="sel-fav" hidden><span data-icon="heart"></span><span class="hide-phone">Favourite</span></button>
                    <button type="button" class="btn ghost" id="sel-album" hidden><span data-icon="folder-plus"></span><span class="hide-phone">Add to album</span></button>
                    <button type="button" class="btn ghost" id="sel-unalbum" hidden><span data-icon="x"></span><span class="hide-phone">Remove from album</span></button>
                    <button type="button" class="btn ghost" id="sel-download"><span data-icon="download"></span><span class="hide-phone">Download</span></button>
                    <button type="button" class="btn ghost" id="sel-rename"><span data-icon="pen"></span><span class="hide-phone">Rename</span></button>
                    <button type="button" class="btn ghost danger" id="sel-delete"><span data-icon="trash"></span><span class="hide-phone">Delete</span></button>
                </div>
            </div>

            <div class="content" id="content" tabindex="0" aria-label="Files">
                <div class="items" id="items"></div>
                <div class="drop" id="drop" hidden><div><span data-icon="upload"></span><span id="drop-text">Drop files to upload</span></div></div>
            </div>

            <footer class="status" id="status"></footer>
        </main>
    </div>

    <div class="menu ctx" id="ctx" hidden role="menu"></div>

    <div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="viewer-title">
        <div class="viewer-bar">
            <button type="button" class="vbtn" id="viewer-close" aria-label="Close"><span data-icon="x"></span></button>
            <span class="viewer-title" id="viewer-title"></span>
            <button type="button" class="vbtn" id="viewer-edit" hidden><span data-icon="pen"></span><span class="hide-phone">Edit</span></button>
            <button type="button" class="vbtn" id="viewer-save" hidden><span data-icon="check"></span><span>Save</span></button>
            <button type="button" class="vbtn" id="viewer-fav" hidden aria-label="Favourite"><span data-icon="heart"></span></button>
            <button type="button" class="vbtn" id="viewer-download"><span data-icon="download"></span><span class="hide-phone">Download</span></button>
        </div>
        <div class="viewer-body" id="viewer-body"></div>
        <button type="button" class="viewer-nav prev" id="viewer-prev" aria-label="Previous" hidden><span data-icon="left"></span></button>
        <button type="button" class="viewer-nav next" id="viewer-next" aria-label="Next" hidden><span data-icon="right"></span></button>
    </div>

    <div class="dialog-wrap" id="dialog" hidden></div>
    <div class="uploads" id="uploads" hidden aria-live="polite"></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="app.js"></script>
    <script src="calendar.js"></script>
    <script src="chat.js"></script>
</body>
</html>
