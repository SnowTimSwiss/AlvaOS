# Lint configuration for the Python backend and scripts.
target-version = "py311"
line-length = 120
extend-include = ["backend/alvaos-priv"]

[lint]
# pycodestyle, pyflakes, bugbear (likely bugs), simplify, pyupgrade, and a few
# checks for needlessly complicated code and commented-out code.
select = ["E", "W", "F", "B", "SIM", "UP", "PIE", "C4", "ERA"]
ignore = [
    # Long lines are wrapped where they read badly; reformatting all of them
    # would only change the diff.
    "E501",
    # Plain if/else and nested ifs read better than the suggested rewrites.
    "SIM102", "SIM105", "SIM108", "SIM117", "SIM118",
    # Several files close their handles explicitly on purpose.
    "SIM115",
    # typing.Callable and friends from collections.abc: a separate cleanup.
    "UP035",
]

[lint.per-file-ignores]
# The entry point imports the blueprints after creating the Flask app.
"backend/alvaos-backend.py" = ["E402"]
# Scripts put backend/ on sys.path before importing from it.
"scripts/**" = ["E402"]
"backend/alvaos-priv" = ["E402"]
