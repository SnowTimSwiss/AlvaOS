# Lint configuration for the Python backend and scripts.
target-version = "py311"
line-length = 120
extend-include = ["backend/alvaos-priv"]

[lint]
# pycodestyle errors, pyflakes, and bugbear (likely bugs).
select = ["E4", "E7", "E9", "F", "B"]

[lint.per-file-ignores]
# The entry point imports the blueprints after creating the Flask app.
"backend/alvaos-backend.py" = ["E402"]
# Scripts put backend/ on sys.path before importing from it.
"scripts/**" = ["E402"]
"backend/alvaos-priv" = ["E402"]
