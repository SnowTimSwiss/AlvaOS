name: Build AlvaOS Installer

on:
  release:
    types: [created, published]
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="dev-${{ github.sha }}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building AlvaOS version: ${VERSION}"
      
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-efi \
            dosfstools \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools
      
      - name: Build installer image
        run: |
          cd installer
          sudo ./build.sh
        env:
          ALVAOS_VERSION: ${{ steps.version.outputs.version }}
      
      - name: Generate checksums
        run: |
          cd installer/build
          sha256sum alvaos-installer-*.iso > checksums.txt
          cat checksums.txt
      
      - name: Upload installer artifact (for non-release builds)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: alvaos-installer-${{ steps.version.outputs.version }}
          path: |
            installer/build/alvaos-installer-*.iso
            installer/build/checksums.txt
          retention-days: 30
      
      - name: Upload installer to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            installer/build/alvaos-installer-*.iso
            installer/build/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Display build info
        run: |
          echo "✅ Build completed successfully!"
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Event: ${{ github.event_name }}"
          ls -lh installer/build/
          echo ""
          echo "Checksums:"
          cat installer/build/checksums.txt
