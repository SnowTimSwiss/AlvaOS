name: Build AlvaOS Installer

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-installer:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-efi \
            dosfstools \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools
      
      - name: Build installer image
        run: |
          cd installer
          sudo ./build.sh
        env:
          ALVAOS_VERSION: ${{ github.sha }}
      
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: alvaos-installer-${{ github.sha }}
          path: installer/build/alvaos-installer-*.iso
          retention-days: 30
      
      - name: Display build info
        run: |
          echo "Build completed successfully!"
          ls -lh installer/build/
          echo "SHA: ${{ github.sha }}"
